name: claude-review
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, issues: write}
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Review this PR against AGENTS.md: private material, prompt-injection surfaces in skills, scripts that fetch or execute, claims that drift from open-stanley/docs/claims.yml. Be specific and short."
