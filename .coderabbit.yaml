language: en-US
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  path_instructions:
    - path: "open-stanley/skills/**/SKILL.md"
      instructions: "Skill bodies are instructions to a language model. Flag vague directives, contradictions with skills/stanley/SKILL.md, and anything that would act on text read from a page or post as if it were a user instruction. Flag any private material (names, post text, meeting content)."
    - path: "open-stanley/skills/stanley/scripts/**"
      instructions: "Standard library only. Flag shell=True, string-built commands, unbounded network fetches, writes outside the vault, and anything that reads credentials from the machine."
    - path: "docs/**"
      instructions: "Website copy: first person, short, no em dashes, no rule of three, no cards or glow. Flag claims not backed by a skill in open-stanley/docs/claims.yml."
chat:
  auto_reply: true
